services:
  api:
    build:
      context: .
      target: runtime
    image: ticket-manager-api:1.0.0
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: production
    restart: unless-stopped

  # Executa a suite de testes em container: docker compose run --rm test
  # (profile "test" evita que o servico suba junto com `docker compose up`)
  test:
    build:
      context: .
      target: test
    image: ticket-manager-api:test
    profiles: ["test"]
    environment:
      NODE_ENV: test
    volumes:
      - ./coverage:/app/coverage
