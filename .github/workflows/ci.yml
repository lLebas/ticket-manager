name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose --profile test build

      - name: Run tests in container
        run: docker compose run --rm test

      - name: Smoke test (docker compose up)
        run: |
          docker compose up -d --wait api
          curl -fsS http://localhost:3000/health
          curl -fsS -X POST http://localhost:3000/api/tickets -H 'Content-Type: application/json' -d '{"title":"Smoke test CI"}'
          curl -fsS http://localhost:3000/api/tickets

      - name: Container logs
        if: always()
        run: docker compose logs api

      - name: Shutdown
        if: always()
        run: docker compose down
